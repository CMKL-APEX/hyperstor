name: Docs

# Builds the public site and the internal book (docs/README.md) and keeps
# them as artifacts. On main, the public site is published to the gh-pages
# branch: the landing page (docs/site/) at the root, the user and
# administrator book (docs/public/) under docs/, and the client API
# reference under api/. The internal set is never published.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The jobs only read the repository; deploy alone writes gh-pages.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  public:

    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: mdbook@0.5.4
    - name: Status page is current (spec/tracking.toml)
      run: |
        python3 scripts/tracking.py status | diff -u docs/public/src/status.md - || {
          echo "docs/public/src/status.md is stale: run scripts/tracking.py status > docs/public/src/status.md"; exit 1;
        }
    - name: Build the public book
      run: mdbook build docs/public
    # Public items only: what a client program uses.
    - name: Build the client API reference
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps -p hyperstor-client -p hyperstor-reactor
    - name: Assemble the site
      run: |
        mkdir -p target/site
        cp -r docs/site/. target/site/
        cp -r target/docs/public target/site/docs
        cp -r target/doc target/site/api
    - name: Check links
      run: python3 scripts/site-link-check.py target/site
    - uses: actions/upload-artifact@v4
      with:
        name: docs-public
        path: target/site

  # Publishes the public site to gh-pages, from main only. The branch holds
  # one commit: each deploy replaces it.
  deploy:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: public
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: docs-public
        path: site
    - uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: site
        force_orphan: true
        commit_message: "Publish docs"

  internal:

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - uses: taiki-e/install-action@v2
      with:
        tool: mdbook@0.5.4
    - name: Build the internal book (spec/)
      run: mdbook build docs/internal
    - name: Build the internal API reference
      # Private items are documented, so links to them are fine here.
      env:
        RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
      run: cargo doc --workspace --no-deps --document-private-items
    - name: Put the API reference under the book
      run: cp -r target/doc target/docs/internal/api
    - uses: actions/upload-artifact@v4
      with:
        name: docs-internal
        path: target/docs/internal
