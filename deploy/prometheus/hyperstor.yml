# Prometheus scrape configuration for Hyperstor's storage nodes.
#
# hyperstor-install writes the targets to /etc/hyperstor/prometheus-targets.json
# on the map service's host: every storage node's metrics address
# (hyperstord --admin), labelled with the cluster id. Copy that file to the
# Prometheus host (or run Prometheus there) and add this job under
# scrape_configs. The metrics ports have no authentication: scrape them over
# the management network only.
scrape_configs:
  - job_name: hyperstor
    scrape_interval: 10s
    file_sd_configs:
      - files: [/etc/hyperstor/prometheus-targets.json]
        refresh_interval: 1m

  # The map service's scrub metrics (28-scrub.md §31.8, D234, D235): GET
  # /metrics on each member's cluster API (port 8850), over mutual TLS with
  # a certificate of role `metrics`. Make it on the Prometheus host:
  #   hyperstorctl token create --role metrics --name prometheus   (an admin)
  #   hyperstorctl --api MEMBER:8850 enroll --file TOKEN --out /etc/prometheus/hyperstor
  # and renew it daily (a timer or cron):
  #   hyperstorctl --api MEMBER:8850 --tls /etc/prometheus/hyperstor cert renew
  # The files must be readable by Prometheus. Every member answers; list them
  # all, so a member being down doesn't stop the scrape.
  - job_name: hyperstor-meta
    scrape_interval: 30s
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/hyperstor/root.crt
      cert_file: /etc/prometheus/hyperstor/admin.crt
      key_file: /etc/prometheus/hyperstor/admin.key
    static_configs:
      - targets: ["MEMBER-1:8850", "MEMBER-2:8850", "MEMBER-3:8850"]
