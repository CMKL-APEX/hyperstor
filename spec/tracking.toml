# Implementation tracking: what each milestone (milestones.md §21)
# delivers, how far it is built, and the tests that show it works.
#
# CI (scripts/tracking.py, run by .github/workflows/ci.yml) checks this
# file against a test run:
#
# - every test named here ran and passed, so renaming or dropping one
#   means updating this file;
# - an item that is `done` names at least one test; `partial` may name
#   some; `planned` names none;
# - citations in `spec` exist (scripts/spec-check.py).
#
# Tests are `<test binary>::<path>` as `cargo test` prints them: the
# binary is the crate name for unit tests (`hyperstor_engine`) and the
# file name for integration tests (`engine` for tests/engine.rs).
#
# `title` and `what` are published in the public status page
# (docs/public/src/status.md): plain words, no internal details. After
# changing this file, run `scripts/tracking.py status > docs/public/src/status.md`.
#
# Status: done | partial | planned.

