[package]
name = "hyperstor-mgmt"
description = "hyperstor-mgmt: the management service: the web dashboard, people's logins and the cluster API on their behalf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hyperstor-api = { path = "../hyperstor-api", features = ["client"] }
hyperstor-pki = { path = "../hyperstor-pki" }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
buffa = { version = "=0.9.2", features = ["json"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
# People's logins (spec/administration.md §23.9, decisions.md D96, D99):
# glidex's session and token rules, Cedar engine and PAM client, pinned to
# a revision of glidex.
glidex-auth = { git = "https://github.com/CMKL-APEX/glidex", rev = "3ed1891d61988ca24edf274ea401cf1960fe3e3f" }
glidex-authd = { git = "https://github.com/CMKL-APEX/glidex", rev = "3ed1891d61988ca24edf274ea401cf1960fe3e3f" }
cedar-policy = "4.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
