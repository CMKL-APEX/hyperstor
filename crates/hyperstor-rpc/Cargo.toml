[package]
name = "hyperstor-rpc"
description = "Multiplexed request/response connections on the hyperstor reactor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hyperstor-codec = { path = "../hyperstor-codec" }
hyperstor-proto = { path = "../hyperstor-proto" }
hyperstor-reactor = { path = "../hyperstor-reactor" }
thiserror.workspace = true
# The data path's handshake (D25, D376): rustls does no I/O of its own and
# is fed from the reactor's sockets.
hyperstor-pki = { path = "../hyperstor-pki" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
