[package]
name = "hyperstor-pki"
description = "Hyperstor's certificates: a root and intermediate CA, leaf identities, and TLS configurations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# The same rustls as connectrpc's (0.23); the ring provider is chosen explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3"
x509-parser = "0.18"
# SHA-256 for root fingerprints; already there for rustls's provider.
ring = "0.17"
# The host's trusted CAs, for hyperstorctl reaching hyperstor-mgmt over HTTPS
# with a certificate of the operator's own or a public CA (D107).
rustls-native-certs = "0.8"

[lints]
workspace = true
