[package]
name = "hyperstor-daemon"
description = "hyperstord: a storage node serving engine shards over the wire protocol (spec/08-engine.md §6, spec/09-replication.md §8)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Path choice per request among a peer's endpoints (D208).
hyperstor-fabric = { path = "../hyperstor-fabric", default-features = false }
# The host's network ports, for the fabric reconciler (D204).
glidex-topology = { git = "https://github.com/CMKL-APEX/glidex", rev = "4d1f5b13f71b134d2bee07c96120438aaf044ef2" }
rand.workspace = true
hyperstor-client = { path = "../hyperstor-client" }
hyperstor-engine = { path = "../hyperstor-engine" }
# Splits and merges of the key–value ranges it is primary of (25-kv-ranges.md §28.7).
hyperstor-kv = { path = "../hyperstor-kv" }
hyperstor-meta = { path = "../hyperstor-meta" }
# Which PG a key belongs to, when a PG splits (24-pools-and-devices.md §27.5).
hyperstor-placement = { path = "../hyperstor-placement" }
hyperstor-proto = { path = "../hyperstor-proto" }
hyperstor-reactor = { path = "../hyperstor-reactor" }

[dev-dependencies]
rand.workspace = true
hyperstor-rpc = { path = "../hyperstor-rpc" }
hyperstor-s3 = { path = "../hyperstor-s3" }
hyperstor-pki = { path = "../hyperstor-pki" }
md-5 = "0.10"
crc32c.workspace = true
tempfile = "3"
# Holds a stopped test node's port for its restart (#276).
socket2 = "0.6"

[lints]
workspace = true
