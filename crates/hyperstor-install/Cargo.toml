[package]
name = "hyperstor-install"
description = "hyperstor-install: host checks and a convergent installer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The host's names and addresses for mgmt's web certificate (D108).
glidex-tls = { git = "https://github.com/CMKL-APEX/glidex", rev = "6500c1f08164ad6de38916b1fe53541711713823" }
hyperstor-engine = { path = "../hyperstor-engine" }
hyperstor-meta = { path = "../hyperstor-meta" }
hyperstor-pki = { path = "../hyperstor-pki" }
# Joining and renewing over the cluster API (spec/19-administration.md §23.4.2).
hyperstor-api = { path = "../hyperstor-api", features = ["client"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
http = "1"
# Reading the map's devices from hyperstorctl --json (D186).
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
io-uring.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
