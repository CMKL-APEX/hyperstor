[package]
name = "hyperstor-meta"
description = "Hyperstor's cluster map and map service (spec/06-metadata.md §4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hyperstor-codec = { path = "../hyperstor-codec" }
hyperstor-map = { path = "../hyperstor-map" }
# The fabric reconciler's decisions, run by the leader (D203).
hyperstor-fabric = { path = "../hyperstor-fabric", default-features = false }
# Volume operations of the cluster API, as a client of .meta (§4.2).
hyperstor-client = { path = "../hyperstor-client" }
# Buckets, read from the key-value store for administrators (D254).
hyperstor-s3 = { path = "../hyperstor-s3" }
hyperstor-placement = { path = "../hyperstor-placement" }
hyperstor-proto = { path = "../hyperstor-proto" }
hyperstor-reactor = { path = "../hyperstor-reactor" }
hyperstor-rpc = { path = "../hyperstor-rpc" }
# The cluster API (spec/19-administration.md §23.5), on its own thread.
hyperstor-api = { path = "../hyperstor-api", features = ["server"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "server", "server-tls"] }
hyperstor-pki = { path = "../hyperstor-pki" }
buffa = { version = "=0.9.2", features = ["json"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# The local socket (§23.6): connectrpc's service on a Unix listener.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http = "1"
# `GET /metrics` beside the RPCs (D234).
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
libc.workspace = true
# The replicated map (04-decisions.md D20, D71): glidex's store and Raft stack,
# pinned to a revision of glidex (PRs #141, #143).
glidex-raftstore = { git = "https://github.com/CMKL-APEX/glidex", rev = "bc1fa833fab0d36bc7ba341569a64dd9d7489a8a" }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "generic-snapshot-data"] }
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OperationService.WatchOperation's stream.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# openraft and glidex-raftstore log through tracing (I259).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry"] }
tracing-core = "0.1"

[dev-dependencies]
tempfile = "3"
tracing = "0.1"

[lints]
workspace = true
