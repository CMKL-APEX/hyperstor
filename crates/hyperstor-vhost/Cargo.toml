[package]
name = "hyperstor-vhost"
description = "hyperstor-vhost: serve hyperstor volumes to VMs over vhost-user-blk (11-frontends.md §11.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hyperstor-vhost"
path = "src/main.rs"

[dependencies]
hyperstor-client = { path = "../hyperstor-client" }
hyperstor-proto = { path = "../hyperstor-proto" }
hyperstor-reactor = { path = "../hyperstor-reactor" }
libc.workspace = true
serde_json = "1"
# rust-vmm, as libraries; our reactor drives them (04-decisions.md D116).
vhost = { version = "=0.18.0", features = ["vhost-user-backend"] }
virtio-bindings = "=0.2.7"
virtio-queue = "=0.18.0"
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }
vmm-sys-util = "=0.15.0"

[lints]
workspace = true
