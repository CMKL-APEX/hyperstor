[package]
name = "hyperstor-test"
description = "Hyperstor's end-to-end test suite: installs clusters from the built binaries and manages them as an operator would"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hyperstor-pki = { path = "../hyperstor-pki" }
# The cluster API, for calls no command makes (GetClusterKey's refusal).
hyperstor-api = { path = "../hyperstor-api", features = ["client"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client", "client-tls"] }
# A PAM helper with made-up people, for hyperstor-mgmt's logins.
glidex-authd = { git = "https://github.com/CMKL-APEX/glidex", rev = "0f7c321eeb23ade8a7812bf2f2f3124fafe78dd9" }
serde_json = "1"
# A made-up identity provider for hyperstor-mgmt's OIDC logins: ES256 keys
# and ID tokens.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
base64 = "0.23"
# A fake tailscaled (glidex's), for mgmt's Tailscale certificates (D109).
glidex-tls = { git = "https://github.com/CMKL-APEX/glidex", rev = "0f7c321eeb23ade8a7812bf2f2f3124fafe78dd9", features = ["test-util"] }
# A fake glidex directory, for mgmt's trust in directories (D306).
glidex-trust = { git = "https://github.com/CMKL-APEX/glidex", rev = "0f7c321eeb23ade8a7812bf2f2f3124fafe78dd9", features = ["fake"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net"] }
# HTTPS to hyperstor-mgmt, verified against the cluster's root (D108).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc.workspace = true
# The hypervisor's side of vhost-user, for hyperstor-vhost's tests.
vhost = { version = "=0.18.0", features = ["vhost-user-frontend"] }
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }
vmm-sys-util = "=0.15.0"

[lints]
workspace = true
