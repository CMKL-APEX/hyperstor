[package]
name = "hyperstor-test"
description = "Hyperstor's end-to-end test suite: installs clusters from the built binaries and manages them as an operator would"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hyperstor-pki = { path = "../hyperstor-pki" }
# A PAM helper with made-up people, for hyperstor-mgmt's logins.
glidex-authd = { git = "https://github.com/CMKL-APEX/glidex", rev = "6500c1f08164ad6de38916b1fe53541711713823" }
serde_json = "1"
# A made-up identity provider for hyperstor-mgmt's OIDC logins: ES256 keys
# and ID tokens.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.22"
# A fake tailscaled (glidex's), for mgmt's Tailscale certificates (D109).
glidex-tls = { git = "https://github.com/CMKL-APEX/glidex", rev = "6500c1f08164ad6de38916b1fe53541711713823", features = ["test-util"] }
tokio = { version = "1", features = ["rt", "net"] }
# HTTPS to hyperstor-mgmt, verified against the cluster's root (D108).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc.workspace = true
# The hypervisor's side of vhost-user, for hyperstor-vhost's tests.
vhost = { version = "=0.18.0", features = ["vhost-user-frontend"] }
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }
vmm-sys-util = "=0.15.0"

[lints]
workspace = true
