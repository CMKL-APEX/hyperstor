[package]
name = "hyperstor-s3"
description = "Hyperstor's S3 gateway: buckets and objects on key–value ranges and s3 chunk objects (spec/14-s3.md §14)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
crc32c.workspace = true
crc32fast = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyperstor-client = { path = "../hyperstor-client" }
hyperstor-codec = { path = "../hyperstor-codec" }
hyperstor-kv = { path = "../hyperstor-kv" }
hyperstor-pki = { path = "../hyperstor-pki" }
hyperstor-proto = { path = "../hyperstor-proto" }
hyperstor-reactor = { path = "../hyperstor-reactor" }
libc.workspace = true
md-5 = "0.10"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror.workspace = true
# The control and HTTP side only (D195): the data path stays on the
# client library's reactors.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
zeroize = "1"

[dev-dependencies]
rand.workspace = true

[lints]
workspace = true
