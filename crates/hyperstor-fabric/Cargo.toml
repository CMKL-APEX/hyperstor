[package]
name = "hyperstor-fabric"
description = "Networks and ports' roles, endpoints ranked by closeness, path choice per I/O, and the fabric reconciler (spec/26-networks.md §29)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The host's topology: NUMA nodes, the PCIe tree, network ports (D204).
glidex-topology = { git = "https://github.com/CMKL-APEX/glidex", rev = "9b69618e53097a32f7c4d6e0f83878bde7116dca", optional = true }
rand.workspace = true

# `host`: reading hosts (endpoints ranked, routing checked). Without it,
# what clients need on the data path: path choice and the model.
[features]
default = ["host"]
host = ["dep:glidex-topology"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
