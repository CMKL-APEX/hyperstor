[package]
name = "hyperstor-ctl"
description = "hyperstorctl: manage and test a hyperstor cluster through the cluster API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hyperstorctl"
path = "src/main.rs"

[dependencies]
hyperstor-api = { path = "../hyperstor-api", features = ["client"] }
hyperstor-client = { path = "../hyperstor-client" }
hyperstor-reactor = { path = "../hyperstor-reactor" }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "client"] }
buffa = { version = "=0.9.2", features = ["json"] }
http = "1"
libc.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
hyperstor-meta = { path = "../hyperstor-meta" }

[lints]
workspace = true
