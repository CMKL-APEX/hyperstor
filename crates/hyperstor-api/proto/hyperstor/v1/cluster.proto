  // Let pools keep fewer copies than their size, never fewer than their
  // min.
  bool force = 3;
}

message RemoveDeviceResponse {
  // Absent for a dry run.
  Operation operation = 1;
  // The PGs that move (or would), with their acting sets before and after.
  repeated PgMove moves = 2;
  // Pools left with fewer failure domains than copies (forced).
  repeated ShortPool short_pools = 3 [json_name = "short_pools"];
  // The devices that take data, with their space after.
  repeated DeviceFill fill = 4;
}

message ShortPool {
  uint32 pool = 1;
  // The copies it keeps.
  uint32 copies = 2;
  // The copies it should keep.
  uint32 size = 3;
}

message DeviceFill {
  uint32 device = 1;
  // Bytes used once the moved PGs are on it.
  uint64 used_bytes = 2 [json_name = "used_bytes"];
  uint64 total_bytes = 3 [json_name = "total_bytes"];
}

message AddDeviceResponse {
  // The new device's id: node × 1000 + its position among the node's.
  uint32 device = 1;
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 2 [json_name = "map_epoch"];
}

message Volume {
  // A 128-bit id, as 32 hexadecimal digits.
  string id = 1;
  // The data pool.
  uint32 pool = 2;
  // In bytes.
  uint64 size = 3;
  string name = 4;
  // "active" or "deleting".
  string state = 5;
  // The header's version: every change bumps it.
  uint64 version = 6;
  // The client instance that has it attached (16 hexadecimal digits);
  // empty if none.
  string attached_by = 7 [json_name = "attached_by"];
  // Its lineage's tenant (D258); 0: none, in realm "default".
  uint32 tenant = 8;
}

message ListVolumesRequest {
  uint32 pool = 1;
}

message ListVolumesResponse {
