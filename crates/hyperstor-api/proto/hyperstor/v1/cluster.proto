  uint64 expires_ms = 5 [json_name = "expires_ms"];
}

message ClaimPortRequest {
  uint32 node = 1;
  string name = 2;
  string holder = 3;
  bool exclusive = 4;
  // 10 to 3600.
  uint32 ttl_secs = 5 [json_name = "ttl_secs"];
}

message ClaimPortResponse {
