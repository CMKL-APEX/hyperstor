  Drive drive = 5;
}

message PerfSample {
  uint64 unix_ms = 1 [json_name = "unix_ms"];
  uint32 window_ms = 2 [json_name = "window_ms"];
  // Client requests its PGs served as primary, per second.
  float read_ops = 3 [json_name = "read_ops"];
  float write_ops = 4 [json_name = "write_ops"];
  float read_bytes = 5 [json_name = "read_bytes"];
  float write_bytes = 6 [json_name = "write_bytes"];
  // The device's own reads and commits.
  ServiceTime reads = 7;
  ServiceTime commits = 8;
  uint32 inflight_max = 9 [json_name = "inflight_max"];
}

message ServiceTime {
  uint32 count = 1;
  uint64 bytes = 2;
  uint32 p50_us = 3 [json_name = "p50_us"];
  uint32 p99_us = 4 [json_name = "p99_us"];
  uint32 max_us = 5 [json_name = "max_us"];
  // Counts per bucket: under 16, 32, ... 65536 us, then slower.
  repeated uint32 buckets = 6;
}

message Drive {
  string model = 1;
  string firmware = 2;
  optional float temperature_c = 3 [json_name = "temperature_c"];
  // PCIe lanes and GT/s, now and at most.
  optional uint32 link_width = 4 [json_name = "link_width"];
  optional uint32 link_width_max = 5 [json_name = "link_width_max"];
  optional float link_speed = 6 [json_name = "link_speed"];
  optional float link_speed_max = 7 [json_name = "link_speed_max"];
  // The drive's NUMA node and its reactor's; -1 unknown.
  int32 numa_node = 8 [json_name = "numa_node"];
  int32 reactor_numa_node = 9 [json_name = "reactor_numa_node"];
  bool write_cache = 10 [json_name = "write_cache"];
  Smart smart = 11;
  // Why there is no SMART.
  string smart_note = 12 [json_name = "smart_note"];
}

message Smart {
  uint32 critical_warning = 1 [json_name = "critical_warning"];
  float temperature_c = 2 [json_name = "temperature_c"];
  uint32 available_spare = 3 [json_name = "available_spare"];
  uint32 spare_threshold = 4 [json_name = "spare_threshold"];
  uint32 percentage_used = 5 [json_name = "percentage_used"];
  uint64 bytes_read = 6 [json_name = "bytes_read"];
  uint64 bytes_written = 7 [json_name = "bytes_written"];
  uint64 power_on_hours = 8 [json_name = "power_on_hours"];
  uint64 unsafe_shutdowns = 9 [json_name = "unsafe_shutdowns"];
  uint64 media_errors = 10 [json_name = "media_errors"];
  uint32 warning_temp_minutes = 11 [json_name = "warning_temp_minutes"];
  uint32 critical_temp_minutes = 12 [json_name = "critical_temp_minutes"];
  repeated uint32 throttle_seconds = 13 [json_name = "throttle_seconds"];
  float warning_threshold_c = 14 [json_name = "warning_threshold_c"];
  float critical_threshold_c = 15 [json_name = "critical_threshold_c"];
}

message ListTopVolumesRequest {
  // At most this many; 0: 20.
  uint32 limit = 1;
}

message ListTopVolumesResponse {
  repeated VolumeHeat volumes = 1;
}

message ListFindingsRequest {}

message ListFindingsResponse {
  repeated Finding findings = 1;
}

message Finding {
  // The rule that found it: slow-device, hot-primary, hot-volume,
  // pcie-link, numa, drive-critical, media-errors, wear, thermal.
  string rule = 1;
  // info, warn or error.
  string severity = 2;
  // What it is about: "device 1002", "volume ...".
  string subject = 3;
  string title = 4;
  string evidence = 5;
  string action = 6;
  // A command that does it; empty if none.
  string command = 7;
}
