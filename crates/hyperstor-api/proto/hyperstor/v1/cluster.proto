  uint64 map_epoch = 2 [json_name = "map_epoch"];
}

message RenewClaimRequest {
  uint32 node = 1;
  string name = 2;
  string holder = 3;
  // 10 to 3600.
  uint32 ttl_secs = 4 [json_name = "ttl_secs"];
}

message RenewClaimResponse {
  PortClaim claim = 1;
}

message ReleaseClaimRequest {
  uint32 node = 1;
  string name = 2;
  string holder = 3;
  // Whoever holds it (admin and mgmt).
  bool any = 4;
}

message ReleaseClaimResponse {
  uint64 map_epoch = 1 [json_name = "map_epoch"];
}

message ListClaimsRequest {
  // Only this holder's.
  optional string holder = 1;
}

message ListClaimsResponse {
