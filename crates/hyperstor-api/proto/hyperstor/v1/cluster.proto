// The cluster API (spec/19-administration.md §23.5), served by every
// hyperstor-meta member. Reads come from the member's published map;
// writes change the working map, which is published after fencing
// (04-decisions.md D42).
syntax = "proto3";

package hyperstor.v1;

import "hyperstor/v1/admin.proto";

service ClusterService {
  // Health with its reasons, nodes, devices and pools. Read.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Acting and up sets of one pool's PGs, or of one PG. Read.
  rpc ListPgs(ListPgsRequest) returns (ListPgsResponse);

  // One pool's PG states, a byte each, for a grid (04-decisions.md D154):
  // nothing but the epoch while the map is still at `since_epoch`. Read.
  rpc GetPgGrid(GetPgGridRequest) returns (GetPgGridResponse);

  // Load and drives (27-performance.md §30, D218-D222). Only the leader
  // has them: another member answers unavailable (not_leader).

  // One pool's requests per PG over the last window, as its primaries
  // reported them; with `pg`, that PG's top volumes too. Read.
  rpc GetPgHeat(GetPgHeatRequest) returns (GetPgHeatResponse);

  // Each device's last 15 minutes (5-s windows) of requests and device
  // service time, and its drive; with `device`, that one only. Read.
  rpc ListDevicePerf(ListDevicePerfRequest) returns (ListDevicePerfResponse);

  // The volumes sending most requests now, summed over their PGs. Read.
  rpc ListTopVolumes(ListTopVolumesRequest) returns (ListTopVolumesResponse);

  // The Advisor's findings: what the load and the drives suggest doing,
  // with the numbers behind each. Nothing is done for you. Read.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);

  // Takes a device out of placement, so its PGs move elsewhere, or brings
  // it back in. Write.
  rpc SetDeviceIn(SetDeviceInRequest) returns (SetDeviceInResponse);

  // Sets a device's placement weight, or lets it follow the device's
  // capacity again (04-decisions.md D158); its PGs move as the weight
  // changes. Write.
  rpc SetDeviceWeight(SetDeviceWeightRequest) returns (SetDeviceWeightResponse);

  // Sets the fullness thresholds every device is held to (04-decisions.md
  // D27, D182); one not given stays as it is. Write.
  rpc SetFullRatios(SetFullRatiosRequest) returns (SetFullRatiosResponse);

  // Appends a device to a node (04-decisions.md D167): the node's next
  // device, at weight 0 until it reports its capacity, so nothing moves
  // until the node runs it (restarted with one more --shard). Write.
  rpc AddDevice(AddDeviceRequest) returns (AddDeviceResponse);

  // Removes a device (24-pools-and-devices.md §27.2.5, 04-decisions.md
  // D175, D186): it is taken out, and an operation follows its PGs off it,
  // then removes it from the map, with its node if it was the node's last;
  // neither id is given again, and the device's data is left as it is.
  // Refused when a pool using it would keep fewer copies than its min, or,
  // unless forced, than its size, for want of failure domains, and when a
  // device that takes its data would pass 95% full. dry_run changes
  // nothing. Cancelling the operation brings the device back in. Write,
  // with step-up.
  rpc RemoveDevice(RemoveDeviceRequest) returns (RemoveDeviceResponse);

  // Sets a device's class (24-pools-and-devices.md §27.2.4), or lets it
  // follow the device's kind again (04-decisions.md D178). A class holds
  // devices of one kind, and a class named after a kind only that kind.
  // Pools limited to classes move PGs as it changes. Write.
  rpc SetDeviceClass(SetDeviceClassRequest) returns (SetDeviceClassResponse);

  // Asks for devices to be converted to v0.0.8's shard format
  // (08-engine.md §7.1, 04-decisions.md D274): each node converts its own
  // the next time it starts. One-way: builds before v0.0.8 can't open a
  // converted device. Every device asked must have reported its format,
  // which only nodes of v0.0.8 or later do. Write.
  rpc UpgradeDevices(UpgradeDevicesRequest) returns (UpgradeDevicesResponse);

  // Sets a device's endpoints (26-networks.md §29.5, D215), replacing
  // them; none: its address alone. Each is on a data network of the map.
  // The installer sets its node's on every run. A node's own certificate
  // may set only its own devices'; admin and mgmt any device's.
  rpc SetEndpoints(SetEndpointsRequest) returns (SetEndpointsResponse);

  // The nodes' network ports (26-networks.md §29.3, §29.8): each one's
  // role and, as its node last reported it, its state, speed, addresses
  // and traffic; for ports that carry storage, the fabric reconciler's
  // lease and weight. Only the leader has the reports. Read.
  rpc ListPorts(ListPortsRequest) returns (ListPortsResponse);

  // Sets a port's role (D209, D237); with none, the default again:
  // `storage` for a port that carries an endpoint, `host` otherwise. A
  // `compute` port is lent to storage only while idle (D238). Write.
  rpc SetPortRole(SetPortRoleRequest) returns (SetPortRoleResponse);

  // When `compute` ports are lent to storage (D209): for the cluster, or
  // with `node` and `name` for one port; without `lending`, the default
  // again (the cluster's: `idle`, D238). Write.
  rpc SetLending(SetLendingRequest) returns (SetLendingResponse);

  // An orchestrator claims a port for `ttl_secs` (26-networks.md §29.9,
  // D205, D239): exclusive, storage leaves it; shared, storage may stay;
  // a lent port is taken back either way. Refused while another holder's
  // claim is live. The orchestrator role, admin and mgmt.
  rpc ClaimPort(ClaimPortRequest) returns (ClaimPortResponse);

  // Keeps a claim for `ttl_secs` more; only its holder. Not audited, as
  // it repeats. The orchestrator role, admin and mgmt.
  rpc RenewClaim(RenewClaimRequest) returns (RenewClaimResponse);

  // Ends a claim: its holder's, or with `any` (admin and mgmt) whoever
  // holds it. The orchestrator role, admin and mgmt.
  rpc ReleaseClaim(ReleaseClaimRequest) returns (ReleaseClaimResponse);

  // The live claims, or `holder`'s (D240): what an orchestrator reads
  // with its renewals. The orchestrator role and anyone who may read.
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse);

  // Changes a pool (24-pools-and-devices.md §27.3.2): its device classes
  // (D164) or failure domain, and PGs move to match, or its name; or
  // doubles its PG count, splitting its PGs in place, a few at a time,
  // each paused briefly (§27.5, D173, D187). Refused for .meta, when its
  // devices would span fewer failure domains than the pool's copies, when
  // they mix hard disks and flash unless forced (D172), for a name another
  // pool has, and for a count that isn't twice the pool's or while it
  // splits. Write.
  rpc SetPool(SetPoolRequest) returns (SetPoolResponse);

  // Sets a replicated pool's copies (`size`) and the copies a write needs
  // (`min`) (24-pools-and-devices.md §27.3.5, D283). More copies add a
  // member to each PG, which backfills; fewer drop each PG's last-ranked
  // members at once. Refused for .meta, cache and EC pools, for a min
  // outside 1 to size, when the pool's devices span fewer failure domains
  // than size, for a min above the live copies a PG acts with now, and
  // when a device taking copies would pass backfillfull. dry_run changes
  // nothing. Write, with step-up.
  rpc SetPoolCopies(SetPoolCopiesRequest) returns (SetPoolCopiesResponse);

  // Changes a pool's scrub settings (28-scrub.md §31.2, 04-decisions.md
  // D224); a setting not given stays as it is. Storage nodes follow them
  // from the next PG they scrub. Refused for cache pools, which aren't
  // scrubbed, and, with reason "weakens_scrub", for a change that checks
  // less than the defaults (D226): use WeakenScrubSettings. Write.
  rpc SetScrubSettings(SetScrubSettingsRequest) returns (SetScrubSettingsResponse);

  // As SetScrubSettings, and may weaken them: scrub off, more than 168
  // hours, deep_every above 7, holes only reported, or a deep rate under
  // 32 MiB/s (D226). Needs a reason, kept in the audit event; through
  // hyperstor-mgmt, a login of the last 10 minutes (step-up). Health warns
  // while a pool's settings are weaker than the defaults. Write.
  rpc WeakenScrubSettings(WeakenScrubSettingsRequest) returns (WeakenScrubSettingsResponse);

  // Each pool's scrub, or one pool's (28-scrub.md §31.8, D227): its
  // settings, how long since its PGs were last scrubbed, light and deep,
  // the PGs overdue, unchecked or damaged, and the totals of its PGs' last
  // scrubs of the last 7 days. Up to a minute behind the leader. Read.
  rpc GetScrubStatus(GetScrubStatusRequest) returns (GetScrubStatusResponse);

  // One pool's PGs with their last light and deep scrub (D227). Read.
  rpc ListPgScrubs(ListPgScrubsRequest) returns (ListPgScrubsResponse);

  // Scrubs a pool's PGs, or some of them, now, ahead of their turn
  // (28-scrub.md §31.6, D229), light or deep, at the pool's deep rate; the
  // regular schedule goes on around them. An operation: done once each PG
  // reported a scrub since it started; cancelled, the primaries drop what
  // they haven't begun. Refused for cache pools. Write.
  rpc StartScrub(StartScrubRequest) returns (StartScrubResponse);

  // Adds a device to a pool beyond its classes, or removes one of them
  // from it (24-pools-and-devices.md §27.4, 04-decisions.md D180); PGs
  // move as for SetPool, which it is checked as. Write.
  rpc SetPoolDevice(SetPoolDeviceRequest) returns (SetPoolDeviceResponse);

  // Makes a pool (24-pools-and-devices.md §27.3.1): its device classes are
  // required (04-decisions.md D171) and checked as SetPool checks them;
  // its id is one no pool has had. Write.
  rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse);

  // Deletes a pool (24-pools-and-devices.md §27.3.4, 04-decisions.md
  // D176, D181): it leaves the map at once, its id is never given again,
  // and each device deletes what it holds of it. Refused for .meta and
  // while the pool holds a volume, a snapshot or anything in the trash;
  // dry_run lists those and deletes nothing. force deletes them first,
  // each audited, as an operation that deletes the pool last (D176).
  // Write, with step-up.
  rpc DeletePool(DeletePoolRequest) returns (DeletePoolResponse);

  // A pool's volumes, from their headers in .meta (06-metadata.md §4.2).
  // Read.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // Creates a volume (04-decisions.md D77). Write.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);

  // Moves a volume to the trash (04-decisions.md D54): purged after its
  // pool's grace period, or restored. Write.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // Grows a volume (10-volumes.md §10.2); never shrinks it. An attached
  // holder sees the new size after its next attach. Write.
  rpc ExpandVolume(ExpandVolumeRequest) returns (ExpandVolumeResponse);

  // A volume's snapshots (10-volumes.md §10.3). Read.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Takes a snapshot; an attached volume's holder is quiesced first.
  // Write.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);

  // Moves a snapshot nothing depends on to the trash. Write.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);

  // Creates a volume from a snapshot, sharing its data (10-volumes.md
  // §10.4). Write.
  rpc CloneVolume(CloneVolumeRequest) returns (CloneVolumeResponse);

  // Rolls a detached volume back to one of its snapshots. Write.
  rpc RollbackVolume(RollbackVolumeRequest) returns (RollbackVolumeResponse);

  // Copies into a clone what it reads from its parents, so it depends on
  // them no more: a long operation (D120). Write.
  rpc FlattenVolume(FlattenVolumeRequest) returns (FlattenVolumeResponse);

  // Copies a volume, or one of its snapshots, into a new volume in
  // another pool (10-volumes.md §10.6, D214): a long operation. Write.
  rpc CopyVolume(CopyVolumeRequest) returns (CopyVolumeResponse);

  // Moves a detached volume without snapshots to another pool, keeping
  // its id (D214): a long operation. Write.
  rpc MoveVolume(MoveVolumeRequest) returns (MoveVolumeResponse);

  // Snapshots several volumes at one moment (a consistency group).
  // Write.
  rpc CreateGroupSnapshot(CreateGroupSnapshotRequest) returns (CreateGroupSnapshotResponse);

  // Moves a group's snapshots to the trash; the group goes with the last
  // of them. Write.
  rpc DeleteGroupSnapshot(DeleteGroupSnapshotRequest) returns (DeleteGroupSnapshotResponse);
}

// The trash (19-administration.md §23.9.3, 04-decisions.md D54, D115):
// deleted volumes and snapshots, kept for their pool's grace period.
service TrashService {
  // What's in the trash, in a pool or every data pool. Read.
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse);

  // Brings a volume or a snapshot back. Write (operators, D114).
  rpc RestoreFromTrash(RestoreFromTrashRequest) returns (RestoreFromTrashResponse);

  // Deletes a volume or a snapshot in the trash for good, now: a long
  // operation (D120). Write (storage administrators, with a fresh login).
  rpc PurgeFromTrash(PurgeFromTrashRequest) returns (PurgeFromTrashResponse);

  // A pool's grace period and what a full pool does with its trash. Read.
  rpc GetTrashSettings(GetTrashSettingsRequest) returns (GetTrashSettingsResponse);

  // Sets them. Write (storage administrators, with a fresh login).
  rpc SetTrashSettings(SetTrashSettingsRequest) returns (SetTrashSettingsResponse);
}

// Something in the trash: a volume (with its snapshots), or a snapshot
// of a volume that isn't.
message TrashItem {
  // "volume" or "snapshot".
  string kind = 1;
  // The volume (32 hexadecimal digits).
  string id = 2;
  // The snapshot's epoch; 0 for a volume.
  uint64 epoch = 3;
  string name = 4;
  uint32 pool = 5;
  // The volume's size in bytes.
  uint64 size = 6;
  uint64 trashed_unix = 7 [json_name = "trashed_unix"];
  // When the trash purges it (Unix seconds).
  uint64 purge_unix = 8 [json_name = "purge_unix"];
  // A snapshot's consistency group, if any.
  string group = 9;
}

message ListTrashRequest {
  // 0: every data pool.
  uint32 pool = 1;
}

message ListTrashResponse {
  repeated TrashItem items = 1;
}

message RestoreFromTrashRequest {
  string id = 1;
  // A snapshot of the volume; absent: the volume.
  optional uint64 epoch = 2;
  // The restored volume's name; empty: its own, or NAME-restored if
  // another volume of the pool took it meanwhile.
  string name = 3;
}

message RestoreFromTrashResponse {
  // The volume, as restored (or the one whose snapshot was).
  Volume volume = 1;
}

message PurgeFromTrashRequest {
  string id = 1;
  // A snapshot of the volume; absent: the volume.
  optional uint64 epoch = 2;
}

message PurgeFromTrashResponse {
  // The purge, which runs in the background (04-decisions.md D120).
  Operation operation = 1;
}

message GetTrashSettingsRequest {
  uint32 pool = 1;
}

message SetTrashSettingsRequest {
  uint32 pool = 1;
  // Seconds a deleted volume or snapshot stays; 0 purges at once.
  uint64 grace_seconds = 2 [json_name = "grace_seconds"];
  // "keep" or "purge": what a full pool does with its trash (D115):
  // keep it, or purge the oldest first until the pool is no longer full.
  string on_full = 3 [json_name = "on_full"];
}

message TrashSettings {
  uint32 pool = 1;
  uint64 grace_seconds = 2 [json_name = "grace_seconds"];
  string on_full = 3 [json_name = "on_full"];
}

message GetTrashSettingsResponse {
  TrashSettings settings = 1;
}

message SetTrashSettingsResponse {
  TrashSettings settings = 1;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  // Nothing to report.
  HEALTH_OK = 1;
  // Something is down, degraded or backfilling; data is still writable.
  HEALTH_WARN = 2;
  // Some PG can't take writes, or a cache pool lost data.
  HEALTH_ERROR = 3;
}

message GetStatusRequest {}

message GetStatusResponse {
  // A 128-bit id, in decimal.
  string cluster_id = 1 [json_name = "cluster_id"];
  uint64 epoch = 2;
  Health health = 3;
  repeated Reason reasons = 4;
  repeated Node nodes = 5;
  repeated Pool pools = 6;
  // Where storage nodes and clients reach the map service (the D5
  // protocol), for clients that start from the API.
  string map_address = 7 [json_name = "map_address"];
  // The fullness thresholds devices are held to (04-decisions.md D27, D182).
  FullRatios full_ratios = 8 [json_name = "full_ratios"];
  // The cluster's networks (26-networks.md §29.3).
  repeated Network networks = 9;
}

// Percentages of a device's data area, to a tenth of a percent: past
// `nearfull` it warns, past `backfillfull` it takes no backfill, past
// `full` it refuses what would grow its used space.
message FullRatios {
  double nearfull = 1;
  double backfillfull = 2;
  double full = 3;
}

message Reason {
  Health level = 1;
  string text = 2;
  // The pool it is about and the PGs it names (the first ten), for
  // links; set by scrub's checks (28-scrub.md §31.5).
  optional uint32 pool = 3;
  repeated uint32 pgs = 4;
}

message Node {
  uint32 id = 1;
  uint32 rack = 2;
  // Heard from within the liveness timeout (04-decisions.md D48).
  bool up = 3;
  repeated Device devices = 4;
  // Milliseconds since its last heartbeat reached this map service;
  // absent if none has since it started.
  optional uint64 last_heard_ms = 5 [json_name = "last_heard_ms"];
}

message Device {
  uint32 id = 1;
  // Where its reactor listens.
  string addr = 2;
  // In placement (false after SetDeviceIn with up_in false).
  bool up_in = 3 [json_name = "up_in"];
  double weight = 4;
  string class = 5;
  // The device's data area and what of it is free (D156), from its last
  // report to the leader; empty on another member or before a report.
  optional uint64 total_bytes = 6 [json_name = "total_bytes"];
  optional uint64 free_bytes = 7 [json_name = "free_bytes"];
  // Whether an operator set the weight (SetDeviceWeight); otherwise it is
  // the device's capacity in TiB, from its reports (04-decisions.md D158).
  bool weight_fixed = 8 [json_name = "weight_fixed"];
  // What the device is, as its node reports it: "nvme", "ssd", "hdd" or
  // "file"; empty until the map has it (04-decisions.md D178).
  string kind = 9;
  // Whether an operator set the class (SetDeviceClass, or a class given
  // to AddDevice); otherwise it is the device's kind.
  bool class_fixed = 10 [json_name = "class_fixed"];
  // Against the fullness thresholds (04-decisions.md D27, D182): "ok",
  // "nearfull", "backfillfull" or "full"; empty before a report reaches
  // the leader.
  string fullness = 11;
  // Its endpoints on other networks (D207).
  repeated Endpoint endpoints = 12;
  // Its shard format (1, or 2 for v0.0.8's), from its last report to the
  // leader; absent on another member, before a report, or from a node
  // before v0.0.8 (04-decisions.md D274).
  optional uint32 format = 13;
  // An operator asked for it to be converted (UpgradeDevices); its node
  // converts it at its next start.
  bool upgrade_asked = 14 [json_name = "upgrade_asked"];
}

message Pool {
  uint32 id = 1;
  string name = 2;
  // "replicated", "ec4+2" or "cache".
  string kind = 3;
  uint32 size = 4;
  uint32 min_size = 5 [json_name = "min_size"];
  uint32 pg_count = 6 [json_name = "pg_count"];
  uint32 chunk_size = 7 [json_name = "chunk_size"];
  // "device", "host" or "rack".
  string domain = 8;
  PgCounts pgs = 9;
  // Usable bytes: the most the pool can hold on the devices placement may
  // use for it (its class, in, with weight) when each failure domain holds
  // at most one copy, or one EC shard, of each PG (04-decisions.md D156,
  // D159). Pools that share devices count the same free bytes. Absent until every such
  // device has reported its space to this member, which only the leader
  // hears.
  optional uint64 total_bytes = 10 [json_name = "total_bytes"];
  optional uint64 free_bytes = 11 [json_name = "free_bytes"];
  // The device classes the pool places on (04-decisions.md D164); empty:
  // every device, as pools made before class sets do (D171).
  repeated string classes = 12;
  // Whether those classes hold hard disks and flash both, which only a
  // forced SetPool allows (D172).
  bool mixed_kinds = 13 [json_name = "mixed_kinds"];
  // Devices the pool uses beyond its classes, and devices of its classes
  // it does not use (04-decisions.md D180).
  repeated uint32 added_devices = 14 [json_name = "added_devices"];
  repeated uint32 removed_devices = 15 [json_name = "removed_devices"];
  // "ok", "nearfull" or "full" (04-decisions.md D27): the fullest of the
  // devices it uses, past `backfillfull` counting as nearfull; empty until
  // they have all reported. While "full", new volumes, clones and
  // snapshots in the pool are refused.
  string fullness = 16;
  // The device that set it, when not "ok".
  optional uint32 fullest_device = 17 [json_name = "fullest_device"];
  // A split under way (D187): to twice pg_count, with this many PGs split.
  uint32 split_done = 18 [json_name = "split_done"];
  // Whether the map service doubles its PG count as devices are added
  // (D174, D184): when they call for at least twice as many.
  bool autoscale = 19;
  // The PGs placement goes by (D173): below pg_count after a split, until
  // the new PGs move to their own devices.
  uint32 placement_count = 20 [json_name = "placement_count"];
  bool splitting = 21;
  // Cache pools: seconds a PG waits for a down member before moving to
  // devices without its data (04-decisions.md D189); 0 moves at once.
  uint32 cache_grace = 22 [json_name = "cache_grace"];
  // How scrub checks the pool's copies (D224); cache pools keep the
  // defaults unused.
  ScrubSettings scrub = 23;
}

// A pool's scrub settings (28-scrub.md §31.2, 04-decisions.md D224).
message ScrubSettings {
  // Every PG is light-scrubbed once in this many hours; 0: scrub off.
  uint32 hours = 1;
  // A PG is scrubbed deep, every block read and its CRC checked, once
  // every this-many scrubs: when its last deep scrub is this many
  // intervals old, or it never had one.
  uint32 deep_every = 2 [json_name = "deep_every"];
  // "repair": copies holding zeros where another has holes are replaced
  // from it (D223, D225); "report": only reported.
  string hole_repair = 3 [json_name = "hole_repair"];
  // The most a deep scrub reads, per device, in MiB a second.
  uint32 deep_rate_mib = 4 [json_name = "deep_rate_mib"];
  // What checks less than the defaults (D226), in words; empty if
  // nothing does. Health warns while it isn't.
  repeated string weakened = 5;
}

// Each PG is counted once, under its worst state.
message PgCounts {
  // Every copy in acting, nothing to backfill.
  uint32 clean = 1;
  // Fewer copies than size, at least min_size: writes go on.
  uint32 degraded = 2;
  // Copies being backfilled onto new members of up.
  uint32 backfilling = 3;
  // Below min_size or without a primary: writes stop.
  uint32 inactive = 4;
}

message ListPgsRequest {
  uint32 pool = 1;
  // Only this PG.
  optional uint32 pg = 2;
}

message ListPgsResponse {
  repeated Pg pgs = 1;
}

message Pg {
  uint32 pool = 1;
  uint32 pg = 2;
  // Map epoch of the last change to this PG.
  uint64 epoch = 3;
  // Devices serving the PG, primary first; 4294967295 is a missing shard.
  repeated uint32 acting = 4;
  // Where placement wants the PG; members not in acting are backfilling.
  repeated uint32 up = 5;
}

// A PG's worst state, as PgCounts counts it.
enum PgState {
  PG_STATE_UNSPECIFIED = 0;
  PG_STATE_CLEAN = 1;
  PG_STATE_DEGRADED = 2;
  PG_STATE_BACKFILLING = 3;
  PG_STATE_INACTIVE = 4;
}

message GetPgGridRequest {
  uint32 pool = 1;
  // The epoch of the states the caller has; 0 for none.
  uint64 since_epoch = 2 [json_name = "since_epoch"];
  // Also each PG's usage (D155), unless still at this version; 0 for
  // none. Only the leader has usage: another member answers unavailable.
  optional uint64 since_usage = 3 [json_name = "since_usage"];
}

message GetPgGridResponse {
  // The map epoch the states are from. PG states change only with it.
  uint64 epoch = 1;
  // The map is still at since_epoch: states is empty.
  bool unchanged = 2;
  // A PgState per PG, PG n at byte n.
  bytes states = 3;
  // The version of the usage reports, if usage was asked for.
  uint64 usage_version = 4 [json_name = "usage_version"];
  // The reports are still at since_usage: usage is empty.
  bool usage_unchanged = 5 [json_name = "usage_unchanged"];
  // A level per PG, PG n at byte n: 0 not reported yet, else 1 + 254 x
  // bytes / max_bytes, rounded; 255 is the fullest.
  bytes usage = 6;
  // The bytes on the fullest PG's primary.
  uint64 max_bytes = 7 [json_name = "max_bytes"];
}

message SetDeviceInRequest {
  uint32 device = 1;
  bool up_in = 2 [json_name = "up_in"];
}

message SetDeviceInResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
}

message SetDeviceWeightRequest {
  uint32 device = 1;
  // The weight to keep, 0 or more; absent: follow the device's capacity in
  // TiB again.
  optional double weight = 2;
}

message SetDeviceWeightResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  // The weight now: as set, or the capacity last reported (unchanged
  // until the device reports).
  double weight = 2;
}

message SetFullRatiosRequest {
  // Between 50 and 99, nearfull < backfillfull < full; absent: unchanged.
  optional double nearfull = 1;
  optional double backfillfull = 2;
  optional double full = 3;
}

message SetFullRatiosResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  FullRatios ratios = 2;
}

message AddDeviceRequest {
  uint32 node = 1;
  // IP:PORT where the node's new reactor will listen.
  string address = 2;
  // The device's class (`nvme`, `nvme-qlc`, ...); absent: that of the
  // node's other devices.
  optional string class = 3;
}

message CreatePoolRequest {
  string name = 1;
  // "replicated" or "cache" (EC pools aren't served yet).
  string kind = 2;
  // Copies.
  uint32 size = 3;
  // Copies that must be reachable to write; absent: half the copies,
  // rounded up (1 for a cache pool).
  optional uint32 min_size = 4 [json_name = "min_size"];
  // A power of two; absent: about 100 per device the pool may use, per
  // copy.
  optional uint32 pg_count = 5 [json_name = "pg_count"];
  // Bytes, a multiple of 4096; absent: 4 MiB.
  optional uint32 chunk_size = 6 [json_name = "chunk_size"];
  // "device", "host" or "rack"; absent: "host".
  optional string domain = 7;
  repeated string classes = 8;
  // Allow classes of hard disks and flash both (D172).
  bool force = 9;
  // Whether the map service doubles its PG count as devices are added
  // (04-decisions.md D174, D184); absent: on.
  optional bool autoscale = 10;
  // Cache pools: seconds a PG waits for a down member, up to 3600
  // (04-decisions.md D189); absent: 60.
  optional uint32 cache_grace = 11 [json_name = "cache_grace"];
}

message CreatePoolResponse {
  uint32 pool = 1;
  uint32 pg_count = 2 [json_name = "pg_count"];
  uint64 map_epoch = 3 [json_name = "map_epoch"];
  bool mixed_kinds = 4 [json_name = "mixed_kinds"];
}

message DeletePoolRequest {
  uint32 pool = 1;
  // List what the pool holds; delete nothing.
  bool dry_run = 2 [json_name = "dry_run"];
  // Delete what the pool holds first: its volumes, even attached ones
  // (their holders are preempted), with their snapshots and the trash.
  bool force = 3;
}

message DeletePoolResponse {
  // 0 for a dry run.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  // What the pool holds (volumes, with those in the trash): what keeps it
  // from being deleted.
  repeated Volume volumes = 2;
  // With force: the operation that deletes them, then the pool.
  Operation operation = 3;
}

message SetPoolRequest {
  uint32 pool = 1;
  // The classes to place on; empty: unchanged, unless every_device.
  repeated string classes = 2;
  // Allow a set that mixes hard disks and flash (D172).
  bool force = 3;
  // A new name; absent: unchanged.
  optional string name = 4;
  // "device", "host" or "rack"; absent: unchanged.
  optional string domain = 5;
  // Place on every device, as pools made before class sets do (D171);
  // classes must then be empty.
  bool every_device = 6 [json_name = "every_device"];
  // Twice the pool's PG count: the pool splits (D187).
  optional uint32 pg_count = 7 [json_name = "pg_count"];
  // Turns the autoscaler on or off for the pool (D174, D184).
  optional bool autoscale = 8;
  // Cache pools: seconds a PG waits for a down member, up to 3600; 0
  // moves at once (D189).
  optional uint32 cache_grace = 9 [json_name = "cache_grace"];
}

message GetScrubStatusRequest {
  // Only this pool; every pool when absent.
  optional uint32 pool = 1;
}

message GetScrubStatusResponse {
  repeated PoolScrub pools = 1;
}

// One pool's scrub (28-scrub.md §31.4, §31.5). Cache pools aren't
// scrubbed and aren't listed.
message PoolScrub {
  uint32 pool = 1;
  string name = 2;
  ScrubSettings settings = 3;
  uint32 pg_count = 4 [json_name = "pg_count"];
  // Seconds since the PG scrubbed longest ago was last scrubbed, light (a
  // deep scrub counts) and deep; a PG never scrubbed counts from when it
  // was made or first recorded.
  uint64 oldest_light_secs = 5 [json_name = "oldest_light_secs"];
  uint64 oldest_deep_secs = 6 [json_name = "oldest_deep_secs"];
  // PGs overdue: no light scrub in twice the interval, or no deep scrub in
  // twice the deep interval (D228); the first ten named, as "pool.pg".
  uint32 overdue = 7;
  repeated string overdue_pgs = 8 [json_name = "overdue_pgs"];
  // PGs whose hole check was skipped in their last two scrubs.
  uint32 unchecked = 9;
  // PGs whose last scrub left damaged objects without a good copy.
  uint32 damaged = 10;
  // PGs whose last scrub left objects unresolved.
  uint32 inconsistent = 11;
  // Totals of the PGs' last scrubs, light and deep, that started in the
  // last 7 days.
  ScrubTotals week = 12;
}

message ScrubTotals {
  uint32 scrubs = 1;
  uint64 compared = 2;
  uint64 inconsistent = 3;
  uint64 repaired = 4;
  uint64 unresolved = 5;
  uint64 damaged = 6;
  uint64 holes = 7;
  uint64 holes_repaired = 8 [json_name = "holes_repaired"];
  // Scrubs that skipped the hole check.
  uint32 holes_skipped = 9 [json_name = "holes_skipped"];
}

message StartScrubRequest {
  uint32 pool = 1;
  // These PGs; every PG of the pool if none.
  repeated uint32 pgs = 2;
  // Read every block and check its CRC.
  bool deep = 3;
}

message StartScrubResponse {
  Operation operation = 1;
}

message ListPgScrubsRequest {
  uint32 pool = 1;
  // Only PGs overdue.
  bool overdue = 2;
}

message ListPgScrubsResponse {
  repeated PgScrubs pgs = 1;
}

message PgScrubs {
  uint32 pg = 1;
  // Unix seconds since when it is counted: made, or first recorded.
  uint64 since = 2;
  // Its last light and deep scrub; absent if none since it was recorded.
  PgScrubReport light = 3;
  PgScrubReport deep = 4;
  // "light" or "deep" when overdue; empty otherwise.
  string overdue = 5;
  // Scrubs running that skipped the hole check.
  uint32 skipped = 6;
}

// What one scrub of a PG did and found (28-scrub.md §31.4).
message PgScrubReport {
  // Unix seconds when it started.
  uint64 at = 1;
  uint32 took_ms = 2 [json_name = "took_ms"];
  uint32 compared = 3;
  // Objects whose copies still differed when looked at again.
  uint32 inconsistent = 4;
  uint32 repaired = 5;
  uint32 unresolved = 6;
  // Objects of the primary's copy that failed their checksums and no good
  // copy replaced.
  uint32 damaged = 7;
  // Objects with zeros where another copy has holes (D223), and repaired.
  uint32 holes = 8;
  uint32 holes_repaired = 9 [json_name = "holes_repaired"];
  // Why the hole check was skipped; empty when it ran.
  string holes_skipped = 10 [json_name = "holes_skipped"];
}

message SetScrubSettingsRequest {
  uint32 pool = 1;
  // 1 to 720, or 0: scrub off.
  optional uint32 hours = 2;
  // 1 to 28.
  optional uint32 deep_every = 3 [json_name = "deep_every"];
  // "repair" or "report".
  optional string hole_repair = 4 [json_name = "hole_repair"];
  // 8 to 1024.
  optional uint32 deep_rate_mib = 5 [json_name = "deep_rate_mib"];
  // Why, kept in the audit event; optional here.
  string reason = 6;
}

message SetScrubSettingsResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  ScrubSettings settings = 2;
}

// As SetScrubSettingsRequest; the reason is required.
message WeakenScrubSettingsRequest {
  uint32 pool = 1;
  optional uint32 hours = 2;
  optional uint32 deep_every = 3 [json_name = "deep_every"];
  optional string hole_repair = 4 [json_name = "hole_repair"];
  optional uint32 deep_rate_mib = 5 [json_name = "deep_rate_mib"];
  // Why scrub is weakened, kept in the audit event (D226).
  string reason = 6;
}

message WeakenScrubSettingsResponse {
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  ScrubSettings settings = 2;
}

message SetPoolResponse {
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  // The set mixes hard disks and flash (only when forced).
  bool mixed_kinds = 2 [json_name = "mixed_kinds"];
}

message SetPoolCopiesRequest {
  uint32 pool = 1;
  uint32 size = 2;
  uint32 min = 3;
  bool dry_run = 4 [json_name = "dry_run"];
}

message SetPoolCopiesResponse {
  // The PGs whose members change (or would), acting before and up after.
