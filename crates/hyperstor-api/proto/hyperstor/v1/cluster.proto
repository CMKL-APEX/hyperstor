  repeated PortLending port_lending = 3 [json_name = "port_lending"];
}

message PortLending {
  uint32 node = 1;
  string name = 2;
  string lending = 3;
}

message SetPortRoleResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
}

message SetDeviceClassResponse {
  // The working map's epoch after the change; published once fenced.
