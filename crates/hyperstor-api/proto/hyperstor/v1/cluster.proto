}

// Where a device's reactor also listens, on a network (D207).
message Endpoint {
  string network = 1;
  // IP:PORT.
  string address = 2;
  // In GetStatus: peers report it silent, so senders take the device's
  // other paths (26-networks.md §29.7, D210). Ignored by SetEndpoints.
  bool down = 3;
}

// A network of the cluster (26-networks.md §29.3, D206).
message Network {
  string name = 1;
  // "control", "data" or "both".
  string kind = 2;
  bool trusted = 3;
  // How a port is recognised as on it: "subnet IP/LEN" or "ib PREFIX".
  string matches = 4;
}

message SetEndpointsRequest {
  uint32 device = 1;
  repeated Endpoint endpoints = 2;
}

message SetEndpointsResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
}

// A node's network port (26-networks.md §29.3, §29.8).
message Port {
  uint32 node = 1;
  // The netdev (`ibp12s0`).
  string name = 2;
  // The role in effect: "host", "uplink", "storage", "compute",
  // "converged" or "vm".
  string role = 3;
  // The operator set it; else it follows the port's endpoints (D237).
  bool role_set = 4 [json_name = "role_set"];
  // Its node reported it in the last three reports' time.
  bool reported = 5;
  bool up = 6;
  uint32 speed_mbps = 7 [json_name = "speed_mbps"];
  repeated string addresses = 8;
  // Bytes/s between its node's last two reports: sent, received, and
  // the larger direction's traffic other than hyperstor's.
  uint64 tx_bytes_per_sec = 9 [json_name = "tx_bytes_per_sec"];
  uint64 rx_bytes_per_sec = 10 [json_name = "rx_bytes_per_sec"];
  uint64 other_bytes_per_sec = 11 [json_name = "other_bytes_per_sec"];
  // A `compute` port lent to storage (D209).
  bool lent = 12;
  // Being taken back from storage until then (Unix ms); 0: not.
  uint64 revoking_until_ms = 13 [json_name = "revoking_until_ms"];
  // Senders' weight for its endpoints, MB/s (D208); 0: none.
  uint32 weight_mbs = 14 [json_name = "weight_mbs"];
}

message ListPortsRequest {
  // Only this node's.
  optional uint32 node = 1;
}

message ListPortsResponse {
  repeated Port ports = 1;
}

message SetPortRoleRequest {
  uint32 node = 1;
  // The netdev.
  string name = 2;
  // One of Port.role's; absent: the default again.
  optional string role = 3;
}

message SetLendingRequest {
  // With `name`, one port of this node; neither, the cluster.
