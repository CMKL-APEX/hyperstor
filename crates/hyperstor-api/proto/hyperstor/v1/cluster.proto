  string name = 2;
  // "off", "idle" or "always"; absent: the default again.
  optional string lending = 3;
}

message SetLendingResponse {
  // The working map's epoch after the change; published once fenced.
  uint64 map_epoch = 1 [json_name = "map_epoch"];
}

