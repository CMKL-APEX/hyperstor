}

message SetPoolDeviceRequest {
  uint32 pool = 1;
  uint32 device = 2;
  // true: the pool uses the device; false: it does not.
  bool member = 3;
  // Allow hard disks with flash (D172).
  bool force = 4;
}

message SetPoolDeviceResponse {
  uint64 map_epoch = 1 [json_name = "map_epoch"];
  // The pool's devices mix hard disks and flash (only when forced).
