// Joining hosts, certificates and long operations (spec/19-administration.md
// §23.4.2, §23.5, §23.8), served beside ClusterService by every
// hyperstor-meta member.
syntax = "proto3";

package hyperstor.v1;

// Join tokens (04-decisions.md D57).
service TokenService {
  // Makes a single-use join token for one role. Write: admin or mgmt.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);

  // The tokens this member has made, without their secrets. Read.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);

  // Makes a token unusable. Write.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // Joins a host with a token and a certificate request: the only call
  // that needs no client certificate. A storage host is added to the map.
  rpc Join(JoinRequest) returns (JoinResponse);
}

// S3's access keys and where new buckets go (14-s3.md §14.2,
// 04-decisions.md D231, D232).
service S3Service {
  // Makes an access key for a tenant. Its secret is in the reply only and
  // is never shown again; the map service keeps it encrypted under the
  // cluster key (D162). Write.
  rpc CreateS3Key(CreateS3KeyRequest) returns (CreateS3KeyResponse);

  // The keys, without their secrets. Read.
  rpc ListS3Keys(ListS3KeysRequest) returns (ListS3KeysResponse);

  // Deletes a key: gateways refuse it within seconds. Write.
  rpc RevokeS3Key(RevokeS3KeyRequest) returns (RevokeS3KeyResponse);

  // Adds or changes a placement: the pools a new bucket's index and data
  // go in. CreateBucket uses "default" unless its LocationConstraint names
  // another. Buckets made before keep their pools. Write.
  rpc SetS3Placement(SetS3PlacementRequest) returns (SetS3PlacementResponse);

  // Removes a placement; buckets in its pools stay. Write.
  rpc DeleteS3Placement(DeleteS3PlacementRequest) returns (DeleteS3PlacementResponse);

  // The placements. Read.
  rpc ListS3Placements(ListS3PlacementsRequest) returns (ListS3PlacementsResponse);

  // Buckets, every tenant's or one tenant's, as `tenant/bucket` (D246),
  // read from the key-value store by the map service when asked (D254).
  // Read.
  rpc ListS3Buckets(ListS3BucketsRequest) returns (ListS3BucketsResponse);

  // One bucket. Read.
  rpc GetS3Bucket(GetS3BucketRequest) returns (GetS3BucketResponse);

  // Deletes a bucket with no object and no upload under way (D255). Store.
  rpc DeleteS3Bucket(DeleteS3BucketRequest) returns (DeleteS3BucketResponse);

  // Every key with its secret, and every placement: what a gateway
  // serves with, fetched every few seconds. S3 gateways ("s3"
  // certificates, D233) only.
  rpc GetS3Gateway(GetS3GatewayRequest) returns (GetS3GatewayResponse);
}

// Realms (20-tenants.md §24.8, 04-decisions.md D248–D253): groups of
// tenants with their own pools and endpoints. The realm "default" always
// exists, and holds every tenant not put in another.
service RealmService {
  // Makes a realm. Write.
  rpc CreateRealm(CreateRealmRequest) returns (CreateRealmResponse);

  // The realms, with their tenants and the pools that list them. Read.
  rpc ListRealms(ListRealmsRequest) returns (ListRealmsResponse);

  // Deletes a realm that no tenant, pool or S3 placement names. Write.
  rpc DeleteRealm(DeleteRealmRequest) returns (DeleteRealmResponse);

  // Puts a tenant in a realm; "default" takes it back. Write.
  rpc SetTenantRealm(SetTenantRealmRequest) returns (SetTenantRealmResponse);

  // Sets the realms that may use a pool (D249); none: every realm. Refused
  // while a placement of a realm taken off the list names the pool. Write.
  rpc SetPoolRealms(SetPoolRealmsRequest) returns (SetPoolRealmsResponse);

  // Binds a host to realms (D251, D259), by the name it gives (`--host`,
  // D261): it then attaches only their volumes; none unbinds it. Answered
  // once storage nodes can read it. Write.
  rpc SetHostRealms(SetHostRealmsRequest) returns (SetHostRealmsResponse);
}

// Certificates (04-decisions.md D53, D56).
service CaService {
  // A new certificate for the caller's own identity and addresses, for
  // the key in the request: renewal over the existing mutual TLS session.
  // Any identity of the cluster.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // Certificates issued through the API, and the revocation list. Read.
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);

  // Refuses a certificate, by serial, on every map service member from
  // now until it would have expired (04-decisions.md D56, D93). Write.
  rpc RevokeCertificate(RevokeCertificateRequest) returns (RevokeCertificateResponse);

  // The cluster key (04-decisions.md D162), for a map service member
  // that has none, such as one that joined before the key existed.
  // Map service members ("meta" certificates) only; audited.
  rpc GetClusterKey(GetClusterKeyRequest) returns (GetClusterKeyResponse);
}

// Backups of the map service's store (04-decisions.md D86).
service MapService {
  // A backup of the store now: the map, join tokens, issued certificates
  // and revocations, as `hyperstor-meta --restore` reads it. Write: admin
  // or mgmt, as it holds the token and certificate records.
  rpc GetMapBackup(GetMapBackupRequest) returns (GetMapBackupResponse);
}

// The map service's members (04-decisions.md D87).
service MemberService {
  // Voters and learners, with their addresses, and who leads. Read.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // Adds a member, already running and joined with a meta token: a
  // learner until it has caught up, then a voter. On the leader. Write.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);

  // Removes a member; refused below three voters unless forced. On the
  // leader. Write.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
}

// hyperstor-mgmt's rows in the map service's store: people's accounts,
// sessions, tokens and roles (04-decisions.md D98). Only the mgmt identity
// may call these; keys and values are mgmt's own.
service MgmtStoreService {
  rpc GetRow(GetRowRequest) returns (GetRowResponse);
  // On the leader.
  rpc PutRow(PutRowRequest) returns (PutRowResponse);
  // On the leader.
  rpc DeleteRow(DeleteRowRequest) returns (DeleteRowResponse);
  rpc ListRows(ListRowsRequest) returns (ListRowsResponse);
}

// Changes to nodes that run as operations.
service NodeService {
  // Takes every device of a node out, so its PGs move elsewhere, and
  // follows them as an operation; with dry_run, only says what would move.
  // Write.
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
}

// Long operations (§23.6): drains for now.
// The audit log (spec/19-administration.md §23.9.4, 04-decisions.md D112,
// D113): every change and refused call, kept in .meta a day per object.
service AuditService {
  // Records, newest first, filtered. Security administrators (through
  // hyperstor-mgmt) and the admin certificate.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // hyperstor-mgmt's own records: people's logins, roles and tokens.
  // The mgmt identity only.
  rpc AppendAudit(AppendAuditRequest) returns (AppendAuditResponse);

  // How long records are kept. Read by security administrators.
  rpc GetAuditSettings(GetAuditSettingsRequest) returns (GetAuditSettingsResponse);

  // Sets it. Security administrators, with a fresh login.
  rpc SetAuditSettings(SetAuditSettingsRequest) returns (SetAuditSettingsResponse);
}

message ListAuditRequest {
  // Unix seconds; 0: no bound.
  uint64 since_unix = 1 [json_name = "since_unix"];
  uint64 until_unix = 2 [json_name = "until_unix"];
  // Records whose principal contains this.
  string principal = 3;
  // Records of this operation (exactly).
  string op = 4;
  // At most this many (default 100, at most 1000).
  uint32 limit = 5;
  // A previous answer's `next`: go on from there.
  string after = 6;
}

message AuditRecord {
  // Unix milliseconds.
  uint64 time_ms = 1 [json_name = "time_ms"];
  string principal = 2;
  string op = 3;
  string target = 4;
  string result = 5;
}

message ListAuditResponse {
  repeated AuditRecord records = 1;
  // Where to go on from for more; empty: that was all.
  string next = 2;
}

message AppendAuditRequest {
  // JSON lines, as hyperstor-mgmt writes them to standard error.
  repeated string lines = 1;
}

message AppendAuditResponse {}

message AuditSettings {
  // Days records are kept; 0: forever.
  uint32 retention_days = 1 [json_name = "retention_days"];
}

message GetAuditSettingsRequest {}

message GetAuditSettingsResponse {
  AuditSettings settings = 1;
}

message SetAuditSettingsRequest {
  uint32 retention_days = 1 [json_name = "retention_days"];
}

message SetAuditSettingsResponse {
  AuditSettings settings = 1;
}

service OperationService {
  // One operation. Read.
  rpc GetOperation(GetOperationRequest) returns (Operation);

  // Running and recent operations (finished ones are kept a week),
  // newest first. Read.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);

  // An operation as it is now, then each change, until it finishes
  // (04-decisions.md D121). Read.
  rpc WatchOperation(WatchOperationRequest) returns (stream WatchOperationResponse);

  // Stops an operation and undoes what it can (a drain or a device's
  // removal brings the devices back in). Write.
  rpc CancelOperation(CancelOperationRequest) returns (Operation);
}

message CreateTokenRequest {
  // "node" (a storage host), "meta" (a map service member), "mgmt" (a
  // management client such as glidex's control plane, 04-decisions.md
  // D122), "s3" (an S3 gateway, D233) or "metrics" (a scraper such as
  // Prometheus, which may read the map service's /metrics and nothing
  // else, D234).
  string role = 1;
  // How long the token is valid; 0 means an hour. At most a week.
  uint32 ttl_seconds = 2 [json_name = "ttl_seconds"];
  // "mgmt", "s3" and "metrics": the identity's name, which its
  // certificate carries (hyperstor://<cluster>/<role>/<name>): 1-32 of
  // a-z, 0-9 and -.
  string name = 3;
}

message CreateTokenResponse {
  // Shown once: only its SHA-256 is kept.
  string token = 1;
  Token info = 2;
  // Cluster API addresses a joining host may use (this member's).
  string api_address = 3 [json_name = "api_address"];
}

message Token {
  // The first 12 hex digits of the secret's SHA-256: names the token in
  // lists and revocations without revealing it.
  string id = 1;
  string role = 2;
  // Seconds since 1970.
  uint64 expires_unix = 3 [json_name = "expires_unix"];
  // Used by a join (tokens are single-use) or revoked.
  bool used = 4;
  bool revoked = 5;
  // Who made it, as the audit names callers.
  string created_by = 6 [json_name = "created_by"];
  // "mgmt" and "s3": the identity it enrolls.
  string name = 7;
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated Token tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message RevokeTokenResponse {}

message JoinRequest {
  string token = 1;
  // PEM. Only its public key is used: the token decides the identity.
  string csr = 2;
  // A storage host: where each of its reactors listens, one device each.
  repeated string addresses = 3;
  // A storage host's rack (failure domain).
  uint32 rack = 4;
  // A map service member: its member number and its addresses, which its
  // certificate names (members are listed at install; 04-decisions.md D74).
  uint32 member_id = 5 [json_name = "member_id"];
  repeated string member_ips = 6 [json_name = "member_ips"];
  // An S3 gateway: the addresses its certificate names, so it can serve
  // HTTPS with it where the site brings none.
  repeated string gateway_ips = 7 [json_name = "gateway_ips"];
}

// A "mgmt" token's join: the client's certificate, the root, and the map
// service's addresses (for its data path); it renews the certificate with
// RenewCertificate.
message JoinResponse {
  string cluster_id = 1 [json_name = "cluster_id"];
  // The host's certificate chain (leaf, intermediate) and the root, PEM.
  string certificate = 2;
  string root = 3;
  // A storage host: its node number, and the map service's addresses.
  uint32 node = 4;
  string map_addresses = 5 [json_name = "map_addresses"];
  // A map service member: the intermediate CA (certificate and key), and
  // the cluster file the group was seeded from.
  string intermediate = 6;
  string intermediate_key = 7 [json_name = "intermediate_key"];
  string cluster_file = 8 [json_name = "cluster_file"];
  // The identity the certificate names (`hyperstor://<cluster>/<role>/<id>`).
  string identity = 9;
  // A map service member: the cluster key (04-decisions.md D162), in its
  // file's form; empty where the member answering has none.
  string cluster_key = 10 [json_name = "cluster_key"];
}

message RenewCertificateRequest {
  // PEM; a new key is fine.
  string csr = 1;
}

message RenewCertificateResponse {
  // Chain, leaf then intermediate, PEM.
  string certificate = 1;
  string root = 2;
}

message ListCertificatesRequest {}

message Certificate {
  // Hex, without leading zeros.
  string serial = 1;
  // hyperstor://<cluster>/<role>/<id>
  string identity = 2;
  uint64 not_after_unix = 3 [json_name = "not_after_unix"];
  uint64 issued_unix = 4 [json_name = "issued_unix"];
  // Who it was issued to or for, as the audit names callers.
  string issued_by = 5 [json_name = "issued_by"];
  bool revoked = 6;
}

message RevokedSerial {
  string serial = 1;
  // Kept on the list until then, when the certificate expires anyway.
  uint64 until_unix = 2 [json_name = "until_unix"];
  uint64 revoked_unix = 3 [json_name = "revoked_unix"];
  string revoked_by = 4 [json_name = "revoked_by"];
}

message ListCertificatesResponse {
  repeated Certificate certificates = 1;
  repeated RevokedSerial revoked = 2;
}

message RevokeCertificateRequest {
  string serial = 1;
}

message RevokeCertificateResponse {
  RevokedSerial revoked = 1;
}

message GetMapBackupRequest {}

message GetMapBackupResponse {
  bytes backup = 1;
  string cluster_id = 2 [json_name = "cluster_id"];
  uint64 epoch = 3;
}

message Member {
  uint64 id = 1;
  // Where it talks Raft, and where it serves the map (D72).
  string raft_address = 2 [json_name = "raft_address"];
  string map_address = 3 [json_name = "map_address"];
  // A voter, or a learner still catching up.
  bool voter = 4;
  bool leader = 5;
  // Its cluster API, as it recorded when it last led; empty if it never
  // has, or the members are older. Leader-only calls go there.
  string api_address = 6 [json_name = "api_address"];
  // The last log entry the leader knows this member holds, and how many
  // entries it is behind the leader's log (D281). Only from the leader,
  // and only for a member that has matched an entry.
  optional uint64 matched = 7;
  optional uint64 behind = 8;
  // Milliseconds since this member last answered the answering member's
  // Raft calls (D281); the leader calls every member each 50 ms. Absent
  // for one not heard since the answering member started.
  optional uint64 heard_ms = 9 [json_name = "heard_ms"];
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
  // The member that answered.
  uint64 me = 2;
  // The answering member's Raft progress (D281): its term, the last
  // entry in its log and the last applied to its map; on the leader
  // alone, milliseconds since a quorum last acknowledged it.
  uint64 term = 3;
  optional uint64 last_log_index = 4 [json_name = "last_log_index"];
  optional uint64 applied = 5;
  optional uint64 quorum_ack_ms = 6 [json_name = "quorum_ack_ms"];
}

message AddMemberRequest {
  uint64 id = 1;
  string raft_address = 2 [json_name = "raft_address"];
  string map_address = 3 [json_name = "map_address"];
  // How long the new member may take to catch up before the call fails,
  // leaving it a learner; 0 is 120 s.
  uint32 catch_up_secs = 4 [json_name = "catch_up_secs"];
}

message AddMemberResponse {
  repeated Member members = 1;
}

message RemoveMemberRequest {
  uint64 id = 1;
  bool force = 2;
}

message RemoveMemberResponse {
  repeated Member members = 1;
}

message GetRowRequest {
  string key = 1;
}

message GetRowResponse {
  bool found = 1;
  bytes value = 2;
}

message PutRowRequest {
  string key = 1;
  bytes value = 2;
  // Only if the key has no row yet (already_exists otherwise).
  bool if_absent = 3 [json_name = "if_absent"];
}

message PutRowResponse {}

message DeleteRowRequest {
  string key = 1;
}

message DeleteRowResponse {
  bool found = 1;
}

message ListRowsRequest {
  string prefix = 1;
  // Rows after this key (exclusive): the last key of the previous page.
  string after = 2;
  // At most this many (and 1000).
  uint32 limit = 3;
}

message Row {
  string key = 1;
  bytes value = 2;
}

message ListRowsResponse {
  repeated Row rows = 1;
}

message DrainNodeRequest {
  uint32 node = 1;
  bool dry_run = 2 [json_name = "dry_run"];
}

message DrainNodeResponse {
  // Absent for a dry run.
  Operation operation = 1;
  // The PGs that move (or would), with their acting sets before and after.
  repeated PgMove moves = 2;
}

message PgMove {
  uint32 pool = 1;
  uint32 pg = 2;
  repeated uint32 before = 3;
  repeated uint32 after = 4;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_RUNNING = 1;
  OPERATION_STATE_DONE = 2;
  OPERATION_STATE_FAILED = 3;
  OPERATION_STATE_CANCELLED = 4;
}

message Operation {
  string id = 1;
  // "drain", "flatten", "copy", "move", "purge", "delete-pool" or
  // "remove-device".
  string kind = 2;
  // What it acts on, as "node 3".
  string target = 3;
  OperationState state = 4;
  // Steps done of total: for a drain, PGs moved of those to move.
  uint32 done = 5;
  uint32 total = 6;
  string message = 7;
  uint64 started_unix = 8 [json_name = "started_unix"];
  // 0 while running.
  uint64 finished_unix = 9 [json_name = "finished_unix"];
  string created_by = 10 [json_name = "created_by"];
  // The tenant of the volume it acts on, whose realm's people see it
  // (D283); unset for the cluster's own (drains, scrubs, pools, devices).
  optional uint32 tenant = 11;
  // In answers: the tenant's realm (D286); empty for the cluster's own.
  string realm = 12;
}

message GetOperationRequest {
  string id = 1;
}

message ListOperationsRequest {}

message WatchOperationRequest {
  string id = 1;
}

message WatchOperationResponse {
  Operation operation = 1;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
}

message CancelOperationRequest {
  string id = 1;
}

// The reason an API call failed, attached to every error as a detail
// (glidex grpc.md G-D5): `reason` is stable, for scripts; the message is
// for people. Wire-compatible with google.rpc.ErrorInfo.
message ErrorInfo {
  string reason = 1;
  string domain = 2;
  map<string, string> metadata = 3;
}

message CreateS3KeyRequest {
  // The tenant whose buckets the key reaches, 1 or more.
  uint32 tenant = 1;
  // What the key is for, shown in lists: up to 200 characters.
  string description = 2;
  // The project its new buckets go to (D300), one of the tenant's; 0:
  // the tenant's default project.
  uint32 project = 3;
}

message CreateS3KeyResponse {
  S3Key key = 1;
  // Shown once.
  string secret = 2;
}

message S3Key {
  // The access key id, `HS` and 18 more of A-Z and 2-7.
  string id = 1;
  uint32 tenant = 2;
  string description = 3;
  // Seconds since 1970.
  uint64 created_unix = 4 [json_name = "created_unix"];
  // Who made it, as the audit names callers.
  string created_by = 5 [json_name = "created_by"];
  // In answers: the realm of the key's tenant (D248).
  string realm = 6;
  // The project its new buckets go to; 0: the tenant's default project.
  uint32 project = 7;
}

message ListS3KeysRequest {}

message ListS3KeysResponse {
  repeated S3Key keys = 1;
}

message RevokeS3KeyRequest {
  string id = 1;
}

message RevokeS3KeyResponse {}

message S3Placement {
  // "default", or 1-63 of a-z, 0-9 and -, as LocationConstraint names it.
  string name = 1;
  // Pool names: a bucket's objects, and its index (its listing's ranges).
  // Set by name; kept by id, so a renamed pool keeps its placements, and
  // answered with the pools' names now (empty for a pool deleted since).
  string data_pool = 2 [json_name = "data_pool"];
  string index_pool = 3 [json_name = "index_pool"];
  // In answers: the pools' ids, which gateways go by.
  uint32 data_pool_id = 4 [json_name = "data_pool_id"];
  uint32 index_pool_id = 5 [json_name = "index_pool_id"];
  // The realm whose buckets it places (D249); empty: "default". Each realm
  // has its own placements, in pools it may use.
  string realm = 6;
}

message SetS3PlacementRequest {
  S3Placement placement = 1;
}

message SetS3PlacementResponse {}

message DeleteS3PlacementRequest {
  string name = 1;
  // Empty: "default".
  string realm = 2;
}

message DeleteS3PlacementResponse {}

// A bucket as administrators see it (D246): its tenant and name, which
// together name it.
message S3Bucket {
  uint32 tenant = 1;
  string name = 2;
  // Unix seconds.
  uint64 created_unix = 3 [json_name = "created_unix"];
  // Its pools' names now (empty for a pool deleted since) and ids.
  string data_pool = 4 [json_name = "data_pool"];
  string index_pool = 5 [json_name = "index_pool"];
  uint32 data_pool_id = 6 [json_name = "data_pool_id"];
  uint32 index_pool_id = 7 [json_name = "index_pool_id"];
  // Its tenant's realm (D248).
  string realm = 8;
  // Whether its objects and bytes are known: not for a bucket made before
  // buckets were counted, nor when counting failed (D257).
  bool counted = 9;
  // Its objects, and their bytes (each object's latest version).
  uint64 objects = 10;
  uint64 bytes = 11;
  // Its project (D300); 0: its tenant's default project, for a bucket
  // made before projects.
  uint32 project = 12;
  // The project as `tenant/project`, by names; empty for none.
  string project_name = 13 [json_name = "project_name"];
}

message ListS3BucketsRequest {
  // 0: every tenant's.
  uint32 tenant = 1;
}

message ListS3BucketsResponse {
  // By tenant, then name.
  repeated S3Bucket buckets = 1;
}

message GetS3BucketRequest {
  uint32 tenant = 1;
  string name = 2;
}

message GetS3BucketResponse {
  S3Bucket bucket = 1;
}

message DeleteS3BucketRequest {
  uint32 tenant = 1;
  string name = 2;
}

message DeleteS3BucketResponse {}

message ListS3PlacementsRequest {}

message ListS3PlacementsResponse {
  repeated S3Placement placements = 1;
}

message GetS3GatewayRequest {
  // The realm the gateway serves (D250); empty: "default". Only its
  // tenants' keys and its placements are answered.
  string realm = 1;
}

// A key with its secret, for a gateway only.
message S3GatewayKey {
  string id = 1;
  string secret = 2;
  uint32 tenant = 3;
  // The project the key's new buckets go to; 0: the tenant's default.
  uint32 project = 4;
}

message GetS3GatewayResponse {
  repeated S3GatewayKey keys = 1;
  repeated S3Placement placements = 2;
}

message Realm {
  // 1 or more; 0 is "default".
  uint32 id = 1;
  // 1-63 of a-z, 0-9 and -.
  string name = 2;
  string description = 3;
  uint64 created_unix = 4 [json_name = "created_unix"];
  string created_by = 5 [json_name = "created_by"];
  // In answers: the tenants put in it ("default": those put elsewhere
  // aren't), and the pools whose lists name it.
  repeated uint32 tenants = 6;
  repeated string pools = 7;
  // In answers: the hosts bound to it (D251).
  repeated string hosts = 8;
  // In answers: the ids of `pools`, in the same order.
  repeated uint32 pool_ids = 9 [json_name = "pool_ids"];
}

message CreateRealmRequest {
  string name = 1;
  // Up to 200 characters.
  string description = 2;
}

message CreateRealmResponse {
  Realm realm = 1;
}

message ListRealmsRequest {}

message ListRealmsResponse {
  // "default" first, then by name.
  repeated Realm realms = 1;
  // Pools with no list, which every realm may use.
  repeated string open_pools = 2 [json_name = "open_pools"];
  // Their ids, in the same order: with each realm's `pool_ids`, the pools
  // someone with roles only in realms may put volumes in (D262).
  repeated uint32 open_pool_ids = 3 [json_name = "open_pool_ids"];
}

message DeleteRealmRequest {
  string name = 1;
}

message DeleteRealmResponse {}

message SetTenantRealmRequest {
  uint32 tenant = 1;
  string realm = 2;
}

message SetTenantRealmResponse {}

message SetPoolRealmsRequest {
  // The pool's id.
  uint32 pool = 1;
  // Realm names; none: every realm may use the pool.
  repeated string realms = 2;
}

message SetPoolRealmsResponse {}

message SetHostRealmsRequest {
  // 1-64 of letters, digits, ".", "-" and "_".
  string host = 1;
  // Realm names, "default" among them if it may attach volumes of no
  // other realm; none: unbound.
  repeated string realms = 2;
}

message SetHostRealmsResponse {}

message GetClusterKeyRequest {}

message GetClusterKeyResponse {
  // In its file's form; failed_precondition (no_cluster_key) where the
  // member answering has none.
  string cluster_key = 1 [json_name = "cluster_key"];
}

// Tenants and projects (20-tenants.md §24.9, 04-decisions.md D299–D301):
// a tenant is an organization's account (its bucket names, keys, caps);
// a project, under it, owns volumes and buckets. Every tenant has a
// project "default" that takes containers naming none.
service TenantService {
  // Makes a tenant and its default project; with `id`, adopts a tenant
  // used before records (on volumes, buckets or keys). Write.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);

  // The tenants with records, and their projects. Read.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);

  // Renames a tenant. Write.
  rpc RenameTenant(RenameTenantRequest) returns (RenameTenantResponse);

  // Deletes a tenant that has no project but its default, no volume,
  // bucket or key, and is in realm "default". Write.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  // Makes a project of a tenant. Write.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // Renames a project; a default project keeps its name. Write.
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);

  // Deletes a project with no volume or bucket; a default project goes
  // with its tenant. Write.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // Moves a project to another tenant, of the same realm or another
  // (20-tenants.md §24.9.1, D303), as an operation: its buckets renamed
  // under the new tenant, then its record. Refused first unless the new
  // realm may use its pools, no host bound to realms holds its volumes
  // across realms, and the new tenant has none of its bucket names. Write.
  rpc MoveProject(MoveProjectRequest) returns (MoveProjectResponse);
}

message Project {
  // 1 or more, unique in the cluster.
  uint32 id = 1;
  uint32 tenant = 2;
  // 1-63 of a-z, 0-9 and -; unique within its tenant.
  string name = 3;
  // "active", or "moving" to another tenant.
  string state = 4;
  // Its id in glidex; empty: none.
  string glidex_id = 5 [json_name = "glidex_id"];
  uint64 created_unix = 6 [json_name = "created_unix"];
  string created_by = 7 [json_name = "created_by"];
  // Whether it is its tenant's default project.
  bool is_default = 8 [json_name = "is_default"];
}

message Tenant {
  // 1 or more, unique in the cluster.
  uint32 id = 1;
  // 1-63 of a-z, 0-9 and -, not "default".
  string name = 2;
  // The glidex directory it comes from (its issuer), and its id there;
  // empty: none.
  string directory = 3;
  string glidex_id = 4 [json_name = "glidex_id"];
  uint32 default_project = 5 [json_name = "default_project"];
  uint64 created_unix = 6 [json_name = "created_unix"];
  string created_by = 7 [json_name = "created_by"];
  // In answers: its realm, and its projects by id.
  string realm = 8;
  repeated Project projects = 9;
}

message CreateTenantRequest {
  string name = 1;
  // A tenant used before records to adopt; 0: the next free id.
  uint32 id = 2;
  string directory = 3;
  string glidex_id = 4 [json_name = "glidex_id"];
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {}

message ListTenantsResponse {
  // By id.
  repeated Tenant tenants = 1;
}

message RenameTenantRequest {
  uint32 id = 1;
  string name = 2;
}

message RenameTenantResponse {}

message DeleteTenantRequest {
  uint32 id = 1;
}

message DeleteTenantResponse {}

message CreateProjectRequest {
  uint32 tenant = 1;
  string name = 2;
  string glidex_id = 3 [json_name = "glidex_id"];
}

message CreateProjectResponse {
  Project project = 1;
}

message RenameProjectRequest {
  uint32 id = 1;
  string name = 2;
}

message RenameProjectResponse {}

message DeleteProjectRequest {
  uint32 id = 1;
}

message DeleteProjectResponse {}

message MoveProjectRequest {
  uint32 project = 1;
  // The tenant it goes to.
  uint32 to = 2;
  // Past the new tenant's caps (a cluster administrator only); caps
  // aren't kept yet, so it changes nothing today.
  bool force = 3;
}

message MoveProjectResponse {
  Operation operation = 1;
}

// Trust in glidex directories (19-administration.md §23.12, D306): offers
// to a directory's tenants, the directories that redeemed one, and what
// hyperstor-mgmt relays and pulls for them. A directory is trusted through
// glidex's own handshake (glidex 19-tenancy.md §12, D63–D73): its feed of
// tenants and projects makes the realm's records here (20-tenants.md
// §24.9).
service TrustService {
  // Makes an offer to a directory's tenant: its token, shown once (only
  // its secret's hash is kept), for the tenant's administrator to redeem
  // at the directory. Write.
  rpc CreateOffer(CreateOfferRequest) returns (CreateOfferResponse);

  // The offers, open or not. Read.
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);

  // Revokes an open offer. Write.
  rpc RevokeOffer(RevokeOfferRequest) returns (RevokeOfferResponse);

  // The directories trusted, their tenants and realm, and how their feed
  // stands. Read.
  rpc ListTrustedDirectories(ListTrustedDirectoriesRequest) returns (ListTrustedDirectoriesResponse);

  // Ends the trust in one of a directory's tenants here; hyperstor-mgmt
  // tells the directory. The tenant and its projects stay, unlinked.
  // Write.
  rpc EndTrust(EndTrustRequest) returns (EndTrustResponse);

  // Names the operator tenant (glidex 19-tenancy.md §12.1), a tenant of a
  // trusted directory; none clears it. Write.
  rpc SetOperator(SetOperatorRequest) returns (SetOperatorResponse);

  // hyperstor-mgmt's alone (its certificate): the cluster key it signs
  // with towards directories, made on first use.
  rpc GetTrustKey(GetTrustKeyRequest) returns (GetTrustKeyResponse);

  // hyperstor-mgmt's alone: a directory's POST /trust/v1/redeem, relayed.
  rpc RelayRedeem(RelayRedeemRequest) returns (RelayRedeemResponse);

  // hyperstor-mgmt's alone: a directory's POST /trust/v1/end, relayed.
  rpc RelayEnd(RelayEndRequest) returns (RelayEndResponse);

  // hyperstor-mgmt's alone: the directories whose feeds to pull, and the
  // ends to tell them.
  rpc GetFeedWork(GetFeedWorkRequest) returns (GetFeedWorkResponse);

  // hyperstor-mgmt's alone: a directory's feed as pulled, applied to the
  // replica and the records.
  rpc ApplyFeed(ApplyFeedRequest) returns (ApplyFeedResponse);

  // hyperstor-mgmt's alone: the report to send a directory (D70, glidex
  // D85).
  rpc GetTrustReport(GetTrustReportRequest) returns (GetTrustReportResponse);

  // hyperstor-mgmt's alone: an end the directory has been told of.
  rpc EndNoticed(EndNoticedRequest) returns (EndNoticedResponse);
}

message TrustOffer {
  string id = 1;
  // The glidex tenant's slug, and its directory's issuer.
  string tenant = 2;
  string directory = 3;
  // The name its tenant takes here, and the realm the directory's
  // tenants go to (made at the redeem unless it exists).
  string name = 4;
  string realm = 5;
  // Where the directory reaches hyperstor-mgmt, and its certificate's
  // SHA-256.
  string url = 6;
  string pin = 7;
  uint64 created_unix = 8 [json_name = "created_unix"];
  string created_by = 9 [json_name = "created_by"];
  uint64 expires_unix = 10 [json_name = "expires_unix"];
  // "open", "redeemed", "revoked" or "expired".
  string state = 11;
}

message CreateOfferRequest {
  string tenant = 1;
  string directory = 2;
  // Default: the slug.
  string name = 3;
  // Default: the directory's realm if it has one, else a realm named
  // after the directory.
  string realm = 4;
  string url = 5;
  string pin = 6;
  // 1 to 30; 0: 7.
  uint32 days = 7;
}

message CreateOfferResponse {
  TrustOffer offer = 1;
  // The gxo_ token: shown once.
  string token = 2;
}

message ListOffersRequest {}

message ListOffersResponse {
  repeated TrustOffer offers = 1;
}

message RevokeOfferRequest {
  string id = 1;
}

message RevokeOfferResponse {}

message TrustedTenant {
  // Its id and slug at the directory.
  string id = 1;
  string slug = 2;
  // Its tenant here, 0 if none.
  uint32 tenant = 3;
  string name = 4;
  bool operator = 5;
}

message TrustedDirectory {
  // trusted-<16 hex>.
  string id = 1;
  string issuer = 2;
  string api = 3;
  string realm = 4;
  repeated TrustedTenant tenants = 5;
  // The feed: its revision, when it last changed and when the directory
  // last answered, and what couldn't be applied from it, each retried.
  string revision = 6;
  uint64 applied_unix = 7 [json_name = "applied_unix"];
  uint64 checked_unix = 8 [json_name = "checked_unix"];
  repeated string blocked = 9;
  uint64 created_unix = 10 [json_name = "created_unix"];
}

message ListTrustedDirectoriesRequest {}

message ListTrustedDirectoriesResponse {
  repeated TrustedDirectory directories = 1;
  // The operator tenant, 0 if none.
  uint32 operator = 2;
}

message EndTrustRequest {
  // The directory's issuer or id, and the glidex tenant's slug or id.
  string directory = 1;
  string tenant = 2;
}

message EndTrustResponse {}

message SetOperatorRequest {
  // 0: none.
  uint32 tenant = 1;
}

message SetOperatorResponse {}

message GetTrustKeyRequest {}

message GetTrustKeyResponse {
  string cluster_id = 1 [json_name = "cluster_id"];
  string kid = 2;
  // PKCS#8 DER: secret, held in memory only.
  bytes pkcs8 = 3;
}

message RelayRedeemRequest {
  // The peer assertion, and the body as the directory sent it.
  string assertion = 1;
  bytes body = 2;
}

message RelayRedeemResponse {
  // The HTTP status and JSON body to answer the directory with.
  uint32 status = 1;
  bytes body = 2;
}

message RelayEndRequest {
  string assertion = 1;
  bytes body = 2;
}

message RelayEndResponse {
  uint32 status = 1;
  bytes body = 2;
}

message FeedTarget {
  // A glidex TrustedDirectory record (JSON), and the feed's revision.
  bytes directory = 1;
  string revision = 2;
}

message EndNotice {
  // A glidex TrustedDirectory record (JSON) as it was, and the glidex
  // tenant's id.
  bytes directory = 1;
  string tenant = 2;
}

message GetFeedWorkRequest {}

message GetFeedWorkResponse {
  string cluster_id = 1 [json_name = "cluster_id"];
  repeated FeedTarget targets = 2;
  repeated EndNotice ends = 3;
}

message ApplyFeedRequest {
  string directory = 1;
  // A glidex Snapshot (JSON); empty: unchanged since `revision`.
  bytes snapshot = 2;
  string revision = 3;
}

message ApplyFeedResponse {
  repeated string blocked = 1;
}

message GetTrustReportRequest {
  string directory = 1;
}

message GetTrustReportResponse {
  // A glidex ClusterReport of StorageTenantReport (JSON).
  bytes report = 1;
}

message EndNoticedRequest {
  string directory = 1;
  string tenant = 2;
}

message EndNoticedResponse {}
