[package]
name = "hyperstor-api"
description = "The hyperstor.v1 cluster API: messages, services and clients generated from proto/"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Pinned with glidex's (spec/decisions.md D51, glidex grpc.md G-D10).
connectrpc = { version = "=0.9.1", default-features = false, features = ["json"] }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
# The generated JSON code names serde directly.
serde = "1"

[features]
# Generated clients and their HTTP transport (hyperstorctl, tests).
client = ["connectrpc/client"]
# The standalone hyper server (hyperstor-meta).
server = ["connectrpc/server"]

[build-dependencies]
connectrpc-build = "=0.9.0"
protox = "0.10"

[lints]
workspace = true
