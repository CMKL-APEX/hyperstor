[workspace]
members = [
    "crates/hyperstor-api",
    "crates/hyperstor-authd",
    "crates/hyperstor-client",
    "crates/hyperstor-codec",
    "crates/hyperstor-ctl",
    "crates/hyperstor-daemon",
    "crates/hyperstor-engine",
    "crates/hyperstor-fabric",
    "crates/hyperstor-install",
    "crates/hyperstor-kv",
    "crates/hyperstor-bench",
    "crates/hyperstor-map",
    "crates/hyperstor-meta",
    "crates/hyperstor-mgmt",
    "crates/hyperstor-pki",
    "crates/hyperstor-placement",
    "crates/hyperstor-proto",
    "crates/hyperstor-reactor",
    "crates/hyperstor-rpc",
    "crates/hyperstor-s3",
    "crates/hyperstor-smart",
    "crates/hyperstor-test",
    "crates/hyperstor-ublk",
    "crates/hyperstor-vhost",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CMKL-APEX/hyperstor"

[workspace.dependencies]
crc32c = "0.6.9"
# Exact: its SIMD kernels were audited at this version (I377).
crc-fast = { version = "=1.10.0", default-features = false, features = ["std"] }
io-uring = "0.7"
libc = "0.2"
thiserror = "2"
rand = "0.10"
# The libraries shared with glidex, all at one glidex-commons release tag
# (04-decisions.md D356): a repin is this tag and the version beside it.
glidex-auth = { git = "https://github.com/CMKL-APEX/glidex-commons", branch = "deps/redb-5", version = "0.2.0" }
glidex-authd = { git = "https://github.com/CMKL-APEX/glidex-commons", branch = "deps/redb-5", version = "0.2.0" }
glidex-raftstore = { git = "https://github.com/CMKL-APEX/glidex-commons", branch = "deps/redb-5", version = "0.2.0" }
glidex-tls = { git = "https://github.com/CMKL-APEX/glidex-commons", branch = "deps/redb-5", version = "0.2.0" }
glidex-topology = { git = "https://github.com/CMKL-APEX/glidex-commons", branch = "deps/redb-5", version = "0.2.0" }
glidex-trust = { git = "https://github.com/CMKL-APEX/glidex-commons", branch = "deps/redb-5", version = "0.2.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = 1

[profile.bench]
debug = 1
